<!doctype html>
<html lang="en">
<head>
  <!-- @include head -->
  <title>Andaman Photo &amp; Video Gallery | Diganta Travels</title>
  <meta name="description" content="Photos and videos from Diganta Travels trips across the Andaman Islands — beaches, scuba and sea walks, island cruises, Barren Island and more." />
  <meta property="og:title" content="Postcards from the Andamans — Diganta Travels" />
  <script type="module" src="/src/pages/gallery.js"></script>
</head>
<body data-page="gallery">
  <!-- @include header -->
  <main id="main">
    <section class="page-hero">
      <div class="page-hero__bg"><img src="/media/img/gen/post-sunset-jetty.webp" alt="" /></div>
      <div class="container">
        <ol class="crumbs"><li><a href="/">Home</a></li><li>Gallery</li></ol>
        <h1>Postcards from <em>the Andamans</em></h1>
        <p>Moments from the islands — many filmed by our travellers and our own team on the road, at sea and underwater.</p>
      </div>
    </section>

    <section class="section" style="padding-top: 24px">
      <div class="container">
        <div class="filters">
          <div class="tabs" role="group" aria-label="Filter gallery" data-gallery-filter></div>
          <p class="filters__count" aria-live="polite" data-gallery-count></p>
        </div>
        <div class="masonry" data-gallery></div>
      </div>
    </section>

  </main>

  <div class="lightbox" hidden data-lightbox role="dialog" aria-modal="true" aria-label="Gallery viewer">
    <button class="lightbox__close" type="button" aria-label="Close" data-lightbox-close><svg class="ic"><use href="#i-x"/></svg></button>
    <div>
      <div class="lightbox__stage" data-lightbox-stage></div>
      <p class="lightbox__caption" data-lightbox-caption></p>
    </div>
  </div>
  <!-- @include footer -->
</body>
</html>
